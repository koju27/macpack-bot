name: Weekly takeover poll

on:
  schedule:
    - cron: '0 14 * * 5'   # Friday 9 AM Toronto (winter) -> day poll
    - cron: '0 15 * * 6'   # Saturday 10 AM Toronto (winter) -> time poll
  workflow_dispatch:       # "Run workflow" button for testing
    inputs:
      which:
        description: Which poll to send
        type: choice
        options: [day, time]
        default: day

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node poll.js ${{ github.event.schedule == '0 15 * * 6' && 'time' || inputs.which || 'day' }}
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          POLL_CHANNEL_ID: ${{ secrets.POLL_CHANNEL_ID }}